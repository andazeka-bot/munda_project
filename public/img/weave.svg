<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Anatomy of a textile light guide">
  <defs>
    <linearGradient id="wd-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#f08c2e"/>
    </linearGradient>
    <filter id="wd-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="548" height="408" rx="22" fill="#0b1018" stroke="#1f2a3a" stroke-width="1.5"/>

  <!-- ===== LED module (left) ===== -->
  <g>
    <rect x="30" y="160" width="150" height="100" rx="14" fill="#141d2b" stroke="#2c3b52" stroke-width="1.6"/>
    <text x="46" y="186" fill="#64748b" font-family="Consolas, monospace" font-size="11" letter-spacing="1">LED MODULE</text>
    <!-- LED die -->
    <rect x="52" y="200" width="26" height="40" rx="6" fill="#ffd9a0" filter="url(#wd-glow)"/>
    <!-- driver -->
    <rect x="92" y="202" width="34" height="18" rx="4" fill="#1c2838" stroke="#3d4c63" stroke-width="1.2"/>
    <text x="94" y="215" fill="#9aa8bb" font-family="Consolas, monospace" font-size="9">DRV</text>
    <!-- thermal -->
    <rect x="92" y="226" width="34" height="14" rx="4" fill="#1c2838" stroke="#3d4c63" stroke-width="1.2"/>
    <text x="94" y="237" fill="#9aa8bb" font-family="Consolas, monospace" font-size="9">T°</text>
    <!-- mixer optic -->
    <path d="M130 210 L158 218 L158 262 L130 270 Z" fill="#0e1520" stroke="#54d6e6" stroke-width="1.4" opacity="0.9"/>
    <text x="120" y="294" fill="#54d6e6" font-family="Consolas, monospace" font-size="10">mixer optic</text>
    <!-- ferrule -->
    <rect x="158" y="206" width="26" height="68" rx="6" fill="#101722" stroke="#ffb454" stroke-width="1.6"/>
    <text x="160" y="292" fill="#ffb454" font-family="Consolas, monospace" font-size="10">ferrule</text>
  </g>

  <!-- fibres leaving the ferrule -->
  <g stroke="url(#wd-amber)" stroke-width="2.2" filter="url(#wd-glow)">
    <path d="M184 214 C260 208 300 218 360 212" fill="none"/>
    <path d="M184 232 C260 226 300 236 360 230" fill="none"/>
    <path d="M184 250 C260 244 300 254 360 248" fill="none"/>
    <path d="M184 268 C260 262 300 272 360 266" fill="none"/>
  </g>

  <!-- ===== woven mat (right) ===== -->
  <rect x="356" y="90" width="186" height="300" rx="16" fill="#0d131d" stroke="#2c3b52" stroke-width="1.4"/>

  <!-- warp threads: white polyester (vertical) -->
  <g stroke="#c8d2e0" stroke-width="5" opacity="0.9">
    <line x1="376" y1="100" x2="376" y2="380"/>
    <line x1="400" y1="100" x2="400" y2="380"/>
    <line x1="424" y1="100" x2="424" y2="380"/>
    <line x1="448" y1="100" x2="448" y2="380"/>
    <line x1="472" y1="100" x2="472" y2="380"/>
    <line x1="496" y1="100" x2="496" y2="380"/>
    <line x1="520" y1="100" x2="520" y2="380"/>
  </g>

  <!-- weft threads: PMMA optical fibres (horizontal, glowing at scatter points) -->
  <g stroke="url(#wd-amber)" stroke-width="5" opacity="0.95">
    <line x1="366" y1="130" x2="532" y2="130"/>
    <line x1="366" y1="170" x2="532" y2="170"/>
    <line x1="366" y1="210" x2="532" y2="210"/>
    <line x1="366" y1="250" x2="532" y2="250"/>
    <line x1="366" y1="290" x2="532" y2="290"/>
    <line x1="366" y1="330" x2="532" y2="330"/>
    <line x1="366" y1="360" x2="532" y2="360"/>
  </g>

  <!-- light-scattering structures (activated output areas) -->
  <g fill="#ffd9a0" filter="url(#wd-glow)">
    <circle cx="412" cy="130" r="3.4"/><circle cx="472" cy="130" r="3.4"/><circle cx="520" cy="130" r="3.4"/>
    <circle cx="388" cy="210" r="3.4"/><circle cx="448" cy="210" r="3.4"/><circle cx="508" cy="210" r="3.4"/>
    <circle cx="424" cy="290" r="3.4"/><circle cx="484" cy="290" r="3.4"/><circle cx="520" cy="290" r="3.4"/>
    <circle cx="400" cy="360" r="3.4"/><circle cx="460" cy="360" r="3.4"/>
  </g>

  <!-- top fabric overlay -->
  <path d="M356 118 C420 108 480 124 542 114" stroke="#54d6e6" stroke-width="1.4" fill="none" stroke-dasharray="5 4" opacity="0.8"/>
  <text x="356" y="104" fill="#54d6e6" font-family="Consolas, monospace" font-size="10">top fabric (optional diffusor / reflector)</text>

  <!-- labels -->
  <g font-family="Consolas, monospace" font-size="11" letter-spacing="1">
    <text x="376" y="406" fill="#9aa8bb">WARP · white polyester</text>
    <text x="366" y="120" fill="#ffb454">WEFT · PMMA optical fibres</text>
  </g>
  <text x="30" y="40" fill="#9aa8bb" font-family="Consolas, monospace" font-size="12" letter-spacing="1">ANATOMY OF A TEXTILE LIGHT GUIDE</text>
  <text x="30" y="58" fill="#64748b" font-family="Consolas, monospace" font-size="11">lateral emission · light-scattering surface structures</text>
</svg>
